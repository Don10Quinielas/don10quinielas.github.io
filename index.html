<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DON 10 J7 FINAL</title><style>
body{background:#0c0c0c;margin:0;font-family:Arial;padding:8px}

</style></head><body>
<div class="top">👑 DON 10 QUINIELAS J7<br>$10 • 4217 4702 2005 5194 • 9 PARTIDOS</div>
<input id="nom" placeholder="Tu Nombre">
<div id="lista"></div>
<div id="total" class="total">Total: 1 = $10</div>
<button class="add" onclick="agregar()">➕ AGREGAR OTRA (+$10)</button>

<script>
var data=[
[{n:"JUAREZ",c:"#0d7a3a",i:"J"},{n:"PACHUCA",c:"#0a3d8f",i:"P"}],
[{n:"NEWCASTLE",c:"#000",i:"N"},{n:"BOURNEMOUTH",c:"#d71920",i:"B"}],
[{n:"FULHAM",c:"#000",i:"F"},{n:"CRYSTAL PALACE",c:"#0047ab",i:"CP"}],
[{n:"NOTTINGHAM FOREST",c:"#e30613",i:"NF"},{n:"TOTTENHAM",c:"#132257",i:"T"}],
[{n:"ATHLETIC CLUB",c:"#ee2523",i:"AC"},{n:"ATLETICO MADRID",c:"#e30613",i:"AM"}],
[{n:"ATLETICO SAN LUIS",c:"#e30613",i:"ASL"},{n:"GUADALAJARA",c:"#0d3b8c",i:"G"}],
[{n:"TIGRES",c:"#ffbe00",i:"T"},{n:"NECAXA",c:"#e30613",i:"N"}],
[{n:"ATLAS",c:"#e30613",i:"A"},{n:"ATLANTE FC",c:"#0a3d8f",i:"AT"}],
[{n:"CRUZ AZUL",c:"#0047ab",i:"CA"},{n:"SANTOS",c:"#006341",i:"S"}]
];
var quin=[Array(9).fill("")];
function render(){
let c=document.getElementById("lista");c.innerHTML="";
for(let q=0;q<quin.length;q++){
let h=document.createElement("div");h.style="color:gold;font-weight:bold;margin:8px 2px";h.innerHTML="⭐ QUINIELA #"+(q+1);c.appendChild(h);
for(let i=0;i<9;i++){
let s=quin[q][i];
let d=document.createElement("div");d.className="card";
d.innerHTML=`<button class="btn l ${s=='L'?'on':''}" onclick="pick(${q},${i},'L')">L</button>
<div class="team"><div class="logo" style="background:${data[i][0].c}">${data[i][0].i}</div>${data[i][0].n}</div>
<button class="btn e ${s=='E'?'on':''}" onclick="pick(${q},${i},'E')">E</button>
<div class="team"><div class="logo" style="background:${data[i][1].c}">${data[i][1].i}</div>${data[i][1].n}</div>
<button class="btn v ${s=='V'?'on':''}" onclick="pick(${q},${i},'V')">V</button>`;
c.appendChild(d);
}}
document.getElementById("total").innerHTML="💰 Total: "+quin.length+" = $"+(quin.length*10);
}
function pick(q,i,v){quin[q][i]=v;render();}
function agregar(){let u=quin[quin.length-1];for(let k=0;k<9;k++)if(u[k]==""){alert("Llena Q#"+quin.length);return;}quin.push(Array(9).fill(""));render();}
function enviar(){let n=document.getElementById("nom").value;if(!n){alert("Nombre");return;}
for(let q=0;q<quin.length;q++)for(let k=0;k<9;k++)if(quin[q][k]==""){alert("Falta P"+(k+1)+" Q"+(q+1));return;}
let t="Hola DON 10 J7 Soy "+n+"%0ATotal: "+quin.length+" = $"+(quin.length*10)+"%0A";
for(let q=0;q<quin.length;q++){t+="%0A*Q#"+(q+1)+":*%0A";for(let k=0;k<9;k++)t+=data[k][0].n+" vs "+data[k][1].n+" = "+quin[q][k]+"%0A";}
t+="%0ASPIN 4217 4702 2005 5194 $"+(quin.length*10);
window.open("https://wa.me/5215630490385?text="+t,"_blank");}
render();
</script></body></html>
