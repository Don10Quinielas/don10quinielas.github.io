<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DON 10 J7</title>
<style>
body{background:#0a0a0a;margin:0;font-family:Arial;padding:8px}
.header{background:linear-gradient(90deg,#d4af37,#ffd700,#b8860b);border-radius:16px;padding:14px;text-align:center;color:#000;font-weight:900;margin-bottom:12px;box-shadow:0 0 15px gold}
.header small{font-size:14px;display:block;font-weight:700}
.card{background:#fff;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:8px 10px;margin:8px 0;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
.team{width:32%;text-align:center;font-weight:800;font-size:11px;color:#111}
.team img{width:42px;height:42px;object-fit:contain;display:block;margin:0 auto 3px}
.btn{width:38px;height:38px;border-radius:10px;border:2.5px solid;font-weight:900;font-size:16px;background:#fff}
.btn.l{border-color:#7c3aed;color:#7c3aed}.btn.e{border-color:#d97706;color:#d97706}.btn.v{border-color:#059669;color:#059669}
.btn.on.l{background:#7c3aed;color:#fff}.btn.on.e{background:#d97706;color:#fff}.btn.on.v{background:#059669;color:#fff}
input{width:100%;padding:13px;border-radius:10px;border:2px solid gold;background:#111;color:#fff;margin:10px 0;box-sizing:border-box}
.total{background:gold;color:#000;text-align:center;padding:12px;border-radius:10px;font-weight:900;font-size:18px;margin:10px 0}
.send{width:100%;padding:16px;background:gold;border:none;border-radius:12px;font-weight:900;font-size:18px}
.add{width:100%;padding:12px;background:#111;color:#fff;border:1px dashed gold;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<div class="header">DON 10 QUINIELAS<br><small>JORNADA 7 • $10 • SPIN 4217 4702 2005 5194</small></div>
<input id="nom" placeholder="Tu Nombre">
<div id="lista"></div>
<div id="total" class="total">Total: 1 quiniela = $10</div>
<button class="add" onclick="agregar()">➕ AGREGAR OTRA QUINIELA (+$10)</button>
<button class="send" onclick="enviar()">ENVIAR A DON 10 📲</button>
<script>
var partidos=[
["JUAREZ","PACHUCA"],
["NEWCASTLE","BOURNEMOUTH"],
["FULHAM","CRYSTAL PALACE"],
["NOTTINGHAM FOREST","TOTTENHAM"],
["ATHLETIC CLUB","ATLETICO MADRID"],
["ATLETICO SAN LUIS","GUADALAJARA"],
["TIGRES","NECAXA"],
["ATLAS","ATLANTE FC"],
["CRUZ AZUL","SANTOS"]
];
var quinielas=[Array(9).fill("")];
function render(){
let c=document.getElementById("lista");c.innerHTML="";
for(let q=0;q<quinielas.length;q++){
let t=document.createElement("div");t.style="color:gold;font-weight:bold;margin:10px 2px";t.innerHTML="QUINIELA #"+(q+1);c.appendChild(t);
for(let i=0;i<9;i++){
let d=document.createElement("div");d.className="card";
let sel=quinielas[q][i];
d.innerHTML=`<button class="btn l ${sel=='L'?'on':''}" onclick="pick(${q},${i},'L')">L</button>
<div class="team">${partidos[i][0]}</div>
<button class="btn e ${sel=='E'?'on':''}" onclick="pick(${q},${i},'E')">E</button>
<div class="team">${partidos[i][1]}</div>
<button class="btn v ${sel=='V'?'on':''}" onclick="pick(${q},${i},'V')">V</button>`;
c.appendChild(d);
}}
document.getElementById("total").innerHTML="Total: "+quinielas.length+" quiniela(s) = $"+(quinielas.length*10);
}
function pick(q,i,v){quinielas[q][i]=v;render();}
function agregar(){let u=quinielas[quinielas.length-1];for(let k=0;k<9;k++)if(u[k]==""){alert("Llena la quiniela #"+quinielas.length);return;}quinielas.push(Array(9).fill(""));render();window.scrollTo(0,document.body.scrollHeight);}
function enviar(){let n=document.getElementById("nom").value;if(!n){alert("Pon tu nombre");return;}
for(let q=0;q<quinielas.length;q++)for(let k=0;k<9;k++)if(quinielas[q][k]==""){alert("Falta partido "+(k+1)+" en Q#"+(q+1));return;}
let txt="Hola DON 10 J7 Soy "+n+"%0ATotal: "+quinielas.length+" = $"+(quinielas.length*10)+"%0A";
for(let q=0;q<quinielas.length;q++){txt+="%0A*Q#"+(q+1)+":*%0A";for(let k=0;k<9;k++)txt+=partidos[k][0]+" vs "+partidos[k][1]+" = "+quinielas[q][k]+"%0A";}
txt+="%0ASPIN 4217 4702 2005 5194";
window.open("https://wa.me/5215630490385?text="+txt,"_blank");}
render();
</script>
</body>
</html>
