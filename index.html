<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DON 10 J7</title><style>
body{background:#f1f5f9;margin:0;font-family:Arial;padding:8px}
.header{background:#000;color:gold;border:2px solid gold;border-radius:14px;padding:12px;text-align:center;font-weight:900}
.card{background:#fff;border-radius:16px;padding:10px 8px;margin:10px 0;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.team{width:32%;text-align:center}
.team img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto 4px}
.team span{font-size:11px;font-weight:900;color:#111;display:block;line-height:1.1}
.btn{width:38px;height:38px;border-radius:10px;border:2.5px solid;background:#fff;font-weight:900;font-size:15px}
.btn.l{border-color:#7c3aed;color:#7c3aed}.btn.e{border-color:#d97706;color:#d97706}.btn.v{border-color:#059669;color:#059669}
.btn.on.l{background:#7c3aed;color:#fff}.btn.on.e{background:#d97706;color:#fff}.btn.on.v{background:#059669;color:#fff}
input{width:100%;padding:12px;border:2px solid gold;border-radius:10px;background:#111;color:#fff;box-sizing:border-box;margin:8px 0}
.total{background:gold;color:#000;text-align:center;padding:12px;border-radius:10px;font-weight:900;font-size:18px}
.add{width:100%;padding:12px;background:#fff;border:1px dashed gold;border-radius:10px;margin-top:8px;font-weight:700}
.send{width:100%;padding:15px;background:gold;border:none;border-radius:10px;font-weight:900;font-size:18px;margin-top:10px}
</style></head><body>
<div class="header">👑 DON 10 QUINIELAS J7 $10<br>SPIN 4217 4702 2005 5194 • BOTE 70/20/10</div>
<input id="nom" placeholder="Tu Nombre">
<div id="lista"></div>
<div id="total" class="total">Total: 1 = $10</div>
<button class="add" onclick="agregar()">➕ AGREGAR OTRA (+$10)</button>
<button class="send" onclick="enviar()">ENVIAR A DON 10 📲</button>
<script>
var data=[
[{n:"JUÁREZ",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12321.png&w=100&h=100"},{n:"PACHUCA",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F1230.png&w=100&h=100"}],
[{n:"NEWCASTLE",logo:"https://resources.premierleague.com/premierleague/badges/50/t43.png"},{n:"BOURNEMOUTH",logo:"https://resources.premierleague.com/premierleague/badges/50/t91.png"}],
[{n:"FULHAM",logo:"https://resources.premierleague.com/premierleague/badges/50/t54.png"},{n:"CRYSTAL PALACE",logo:"https://resources.premierleague.com/premierleague/badges/50/t31.png"}],
[{n:"NOTTINGHAM FOREST",logo:"https://resources.premierleague.com/premierleague/badges/50/t17.png"},{n:"TOTTENHAM",logo:"https://resources.premierleague.com/premierleague/badges/50/t6.png"}],
[{n:"ATHLETIC CLUB",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F321.png&w=100&h=100"},{n:"ATLETICO MADRID",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F1068.png&w=100&h=100"}],
[{n:"ATLÉTICO SAN LUIS",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12320.png&w=100&h=100"},{n:"GUADALAJARA",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12325.png&w=100&h=100"}],
[{n:"TIGRES",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F12319.png&w=100&h=100"},{n:"NECAXA",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F1234.png&w=100&h=100"}],
[{n:"ATLAS",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F1238.png&w=100&h=100"},{n:"ATLANTE FC",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F1232.png&w=100&h=100"}],
[{n:"CRUZ AZUL",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F1237.png&w=100&h=100"},{n:"SANTOS",logo:"https://a3.espncdn.com/combiner/i?img=%2Fi%2Fteamlogos%2Fsoccer%2F500%2F1233.png&w=100&h=100"}]
];
var quin=[Array(9).fill("")];
function render(){
let c=document.getElementById("lista");c.innerHTML="";
for(let q=0;q<quin.length;q++){
let h=document.createElement("div");h.style="color:#000;font-weight:900;margin:10px 4px";h.innerHTML="⭐ QUINIELA #"+(q+1);c.appendChild(h);
for(let i=0;i<9;i++){
let s=quin[q][i];
let d=document.createElement("div");d.className="card";
d.innerHTML=`<button class="btn l ${s=='L'?'on':''}" onclick="pick(${q},${i},'L')">L</button>
<div class="team"><img src="${data[i][0].logo}"><span>${data[i][0].n}</span></div>
<button class="btn e ${s=='E'?'on':''}" onclick="pick(${q},${i},'E')">E</button>
<div class="team"><img src="${data[i][1].logo}"><span>${data[i][1].n}</span></div>
<button class="btn v ${s=='V'?'on':''}" onclick="pick(${q},${i},'V')">V</button>`;
c.appendChild(d);
}}
document.getElementById("total").innerHTML="💰 Total: "+quin.length+" = $"+(quin.length*10);
}
function pick(q,i,v){quin[q][i]=v;render();}
function agregar(){let u=quin[quin.length-1];for(let k=0;k<9;k++)if(u[k]==""){alert("Llena Q#"+quin.length);return;}quin.push(Array(9).fill(""));render();}
function enviar(){let n=document.getElementById("nom").value;if(!n){alert("Pon tu nombre");return;}
for(let q=0;q<quin.length;q++)for(let k=0;k<9;k++)if(quin[q][k]==""){alert("Falta P"+(k+1)+" Q"+(q+1));return;}
let t="Hola DON 10 J7 Soy "+n+"%0ATotal: "+quin.length+" = $"+(quin.length*10)+"%0A";
for(let q=0;q<quin.length;q++){t+="%0A*Q#"+(q+1)+":*%0A";for(let k=0;k<9;k++)t+=data[k][0].n+" vs "+data[k][1].n+" = "+quin[q][k]+"%0A";}
t+="%0ASPIN 4217 4702 2005 5194 $"+(quin.length*10);
window.open("https://wa.me/5215630490385?text="+t,"_blank");}
render();
</script></body></html>
